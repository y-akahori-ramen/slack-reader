[project]
name = "slack-reader-mcp"
version = "0.1.0"
description = "Read-only Slack MCP server (assistant.search.context / conversations.replies). Write scopes and posting tools are strictly forbidden."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "cryptography>=42.0",
]

[project.scripts]
slack-mcp-auth = "slack_reader_mcp.auth:main"
slack-mcp-server = "slack_reader_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slack_reader_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
